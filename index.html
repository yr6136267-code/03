Q18. Check if a string is a palindrome
function isPalindrome(str){
  let s1=str.toLowerCase();
  let s2="";
  for (let i=0;i<s1.length;i++){
    s2=s1[i]+s2;
  }
  if (s1==s2){
    return true;
  }
  else{
    return false;
  }
}
